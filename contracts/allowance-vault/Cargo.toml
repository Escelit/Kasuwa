[package]
name = "allowance-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "28.0.0", features = ["hazmat"] }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
proptest = "1.5.0"
hex = "0.4.3"
serde_json = "1.0.138"
